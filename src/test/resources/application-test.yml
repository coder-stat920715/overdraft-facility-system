spring:
  datasource:
    url: jdbc:h2:mem:od_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

overdraft:
  timezone: Asia/Kolkata
  scheduler:
    enabled: false
  interest:
    leap-year-aware: false
